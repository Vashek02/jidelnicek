// ── UTILITIES ────────────────────────────────────────────────────────────────
function haversine([la1,lo1],[la2,lo2]) {
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLa=toRad(la2-la1), dLo=toRad(lo2-lo1);
  const a=Math.sin(dLa/2)**2+Math.cos(toRad(la1))*Math.cos(toRad(la2))*Math.sin(dLo/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}

function distBadge(km) {
  const m = Math.round(km*1000);
  const label = m<1000 ? m+'m' : (km).toFixed(1)+'km';
  if (km<0.6) return `<span class="badge badge-dist-near">📍 ${label}</span>`;
  if (km<1.2) return `<span class="badge badge-dist-mid">📍 ${label}</span>`;
  return `<span class="badge badge-dist-far">📍 ${label}</span>`;
}

// Build similarity map: mealKey → [simTag, ...]
function buildSimMap(restaurants) {
  const grouped = {}; // groupId → [{ri, mi, name}]
  restaurants.forEach((r, ri) => {
    r.meals.forEach((m, mi) => {
      const lower = m.name.toLowerCase();
      SIM_GROUPS.forEach(g => {
        if (g.kws.some(kw => lower.includes(kw))) {
          (grouped[g.id] = grouped[g.id]||[]).push({ri, mi, rName:r.name, g});
        }
      });
    });
  });
  const simMap = {};
  Object.values(grouped).forEach(entries => {
    const uniqueR = [...new Set(entries.map(e=>e.ri))];
    if (uniqueR.length < 2) return;
    entries.forEach(({ri,mi,g}) => {
      const key = `${ri}-${mi}`;
      (simMap[key]=simMap[key]||[]).push({...g, count:uniqueR.length});
    });
  });
  return simMap;
}

// ── SORT & RENDER ────────────────────────────────────────────────────────────
let sortMode = 'dist';
let rankResults = {}; // key → html string

function setSort(mode, el) {
  sortMode = mode;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function getSorted() {
  return [...RESTAURANTS].sort((a,b) => {
    if (sortMode==='dist') return haversine(HOME,a.coords)-haversine(HOME,b.coords);
    if (sortMode==='price') {
      const pa = a.closed||!a.meals.length ? 9999 : Math.min(...a.meals.map(m=>m.price||9999));
      const pb = b.closed||!b.meals.length ? 9999 : Math.min(...b.meals.map(m=>m.price||9999));
      return pa-pb;
    }
    if (sortMode==='pop') return b.fav-a.fav;
    return 0;
  });
}

function renderGrid() {
  const sorted = getSorted();
  const simMap = buildSimMap(sorted);
  // Re-index after sort
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  sorted.forEach((r, ri) => {
    const km = haversine(HOME, r.coords);
    const minPrice = r.meals.length ? Math.min(...r.meals.map(m=>m.price||9999)) : null;

    let hoursHtml = r.closed
      ? `<span class="badge badge-closed">🔒 ${r.hours}</span>`
      : r.delivery && r.hours==='Pouze rozvoz'
        ? `<span class="badge badge-delivery">🚗 Pouze rozvoz</span>`
        : `<span class="badge badge-hours">🕐 ${r.hours}</span>`;
    if (!r.closed && r.delivery) hoursHtml += `<span class="badge badge-delivery">🚗 Rozvoz</span>`;

    const soupHtml = r.soup ? `
      <div class="soup-row">
        <span class="soup-label">Polévka</span>
        <span class="soup-name">${r.soup}</span>
        <span class="soup-price">${r.soupPrice===0?'zdarma':r.soupPrice?r.soupPrice+' Kč':''}</span>
      </div>` : '';

    let mealsHtml = '';
    if (r.closed) {
      mealsHtml = `<div class="closed-note">Dnes zavřeno – ${r.note||''}</div>`;
    } else {
      r.meals.forEach((m, mi) => {
        const key = `${ri}-${mi}`;
        const tags = (simMap[key]||[]).map(sg=>
          `<span class="sim-tag" style="background:${sg.bg};color:${sg.color};border:1px solid ${sg.color}40">${sg.label}</span>`
        ).join('');
        const tagsHtml = tags ? `<div class="meal-tags">${tags}</div>` : '';
        const rankKey = `${r.id}-${mi}`;
        const resultHtml = rankResults[rankKey]
          ? `<div class="rank-result visible" id="rr-${rankKey}">${rankResults[rankKey]}</div>`
          : `<div class="rank-result" id="rr-${rankKey}"></div>`;

        mealsHtml += `
          <div class="meal-row">
            <div class="meal-info">
              <div class="meal-name">${m.name}</div>
              ${tagsHtml}
            </div>
            <div class="meal-right">
              <span class="meal-price">${m.price?m.price+' Kč':'–'}</span>
              <button class="rank-btn" id="rb-${rankKey}" onclick="rankMeal('${rankKey}','${r.name.replace(/'/g,"\\'")}','${m.name.replace(/'/g,"\\'").replace(/"/g,'&quot;')}',${m.price||0})">🏆 Ohodnotit</button>
            </div>
          </div>
          ${resultHtml}`;
      });
    }

    const noteHtml = (r.note && !r.closed) ? `<div style="padding:8px 20px;font-size:11px;color:#7a5020;font-style:italic;border-bottom:1px solid rgba(180,130,40,0.1)">${r.note}</div>` : '';

    const card = document.createElement('div');
    card.className = `card glass${r.closed?' closed':''}`;
    card.innerHTML = `
      <div class="card-header">
        <div class="card-name">${r.name}</div>
        <div class="card-address">${r.address}${r.phone?` · ☎ ${r.phone}`:''}</div>
        <div class="card-meta">
          ${distBadge(km)}
          ${hoursHtml}
          ${minPrice&&!r.closed?`<span class="badge" style="background:rgba(100,150,100,0.15);color:#2a5a2a;border:1px solid rgba(100,150,100,0.3)">od ${minPrice} Kč</span>`:''}
        </div>
      </div>
      ${soupHtml}
      ${noteHtml}
      <div class="meals-list">${mealsHtml}</div>`;
    grid.appendChild(card);
  });

  document.getElementById('rest-count').textContent =
    RESTAURANTS.filter(r=>!r.closed).length + ' restaurací dnes';
}

// ── RANKING ──────────────────────────────────────────────────────────────────
async function rankMeal(rankKey, restaurant, mealName, price) {
  const btn = document.getElementById('rb-'+rankKey);
  const resultEl = document.getElementById('rr-'+rankKey);
  if (!btn||!resultEl) return;
  btn.textContent = '⏳';
  btn.disabled = true;

  const prompt = `Rate this Czech lunch meal concisely.

Restaurant: ${restaurant}
Meal: ${mealName}
Price: ${price} CZK

Respond in exactly this format (plain text, under 55 words total):
🥗 Health: X/5 — [one short reason]
🍺 Pub-heaviness: X/5 — [how greasy/heavy vs light]
💡 Verdict: [one punchy sentence]

Context: pub-style Czech problems = heavy gravies, deep-fried everything, minimal vegetables, excess dumplings/bread, high saturated fat.`;

  try {
    const result = await window.cowork.askClaude(prompt, []);
    const html = `<div class="rank-meal-name">${mealName}</div>${result.replace(/\n/g,'<br>')}`;
    rankResults[rankKey] = html;
    resultEl.innerHTML = html;
    resultEl.classList.add('visible');
    btn.textContent = '✓ Hotovo';
  } catch(e) {
    resultEl.innerHTML = `<div style="color:#8b2a2a">Ohodnocení se nezdařilo: ${e.message||'chyba'}</div>`;
    resultEl.classList.add('visible');
    btn.textContent = '🏆 Zkusit znovu';
    btn.disabled = false;
  }
}

// ── LIVE REFRESH ─────────────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('status').textContent = 'Načítám aktuální menu z olomouc.cz…';
  document.getElementById('loading').style.display = 'flex';
  try {
    const raw = await window.cowork.callMcpTool('mcp__Windows-MCP__Scrape', {
      url: 'https://www.olomouc.cz/poledni-menu',
      query: 'restaurant meals prices lunch menu today',
      use_sampling: true
    });
    const text = typeof raw === 'string' ? raw : (raw?.result || JSON.stringify(raw));
    // Use askClaude to extract summary of what changed
    const summary = await window.cowork.askClaude(
      `From this Olomouc lunch menu page content, list any restaurants NOT already in this list: SENIMO, VIKTORIA, CARUSO, U RYTÍŘE, PORTO, LEGUÁN, AVION, U ČERVENÉHO VOLKA, MORITZ, SLOVANSKÝ DŮM, BLUES ROCK CAFE, AQUA, U ANČI, ASADO GRILL, JELENA, SVATOVÁCLAVSKÝ PIVOVAR, LOBSTER. If all are present and data looks fresh, reply: "Data aktuální." Otherwise list new restaurants with their menus briefly.`,
      [{type:'text', text: text.substring(0,8000)}]
    );
    document.getElementById('status').textContent = '✓ Aktualizováno · ' + summary;
  } catch(e) {
    document.getElementById('status').textContent = 'Aktualizace se nezdařila – zobrazena uložená data. (' + (e.message||'chyba') + ')';
  }
  document.getElementById('loading').style.display = 'none';
}
